<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Going On — Event Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Going On</h1>
    <p class="subtitle">Keep track of events you don't want to miss</p>
  </header>

  <main>
    <section class="controls">
      <button id="add-event-btn" class="btn btn-primary">+ Add Event</button>
      <div class="filter-group">
        <label for="filter">Show:</label>
        <select id="filter">
          <option value="all">All Events</option>
          <option value="upcoming">Upcoming</option>
          <option value="ongoing">Happening Now</option>
          <option value="past">Past</option>
        </select>
      </div>
    </section>

    <section id="events-list" class="events-list">
      <!-- Events rendered here by JS -->
    </section>

    <p id="no-events" class="no-events" hidden>No events to show. Add one to get started!</p>
  </main>

  <!-- Add / Edit Event Modal -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal">
      <h2 id="modal-title">Add Event</h2>
      <form id="event-form">
        <input type="hidden" id="event-id">

        <div class="form-group">
          <label for="event-name">Name</label>
          <input type="text" id="event-name" required placeholder="e.g. Jazz Festival">
        </div>

        <div class="form-group">
          <label for="event-location">Location</label>
          <input type="text" id="event-location" required placeholder="e.g. Central Park, NYC">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="event-start">Starts</label>
            <input type="datetime-local" id="event-start" required>
          </div>
          <div class="form-group">
            <label for="event-end">Ends</label>
            <input type="datetime-local" id="event-end" required>
          </div>
        </div>

        <div class="form-group">
          <label for="event-details">Details</label>
          <textarea id="event-details" rows="3" placeholder="What's this event about?"></textarea>
        </div>

        <div class="form-actions">
          <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
