<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goings On — Things I Don't Want to Miss</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>GOINGS ON</h1>
    <p class="subtitle">Things I don't want to miss</p>
  </header>

  <main>
    <section class="controls">
      <button id="add-event-btn" class="btn btn-primary">+ Add Event</button>
      <button id="export-btn" class="btn btn-secondary">Export</button>
      <div class="filters">
        <div class="filter-group">
          <label for="filter">Show:</label>
          <select id="filter">
            <option value="all">All Events</option>
            <option value="upcoming">Upcoming</option>
            <option value="ongoing">Happening Now</option>
            <option value="past">Past</option>
            <option value="attended">Attended</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-month">Month:</label>
          <select id="filter-month">
            <option value="all">All Months</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-category">Category:</label>
          <select id="filter-category">
            <option value="all">All Categories</option>
            <option value="Exhibition">Exhibition</option>
            <option value="Concert">Concert</option>
            <option value="Theatre">Theatre</option>
            <option value="Contemporary Dance">Contemporary Dance</option>
            <option value="Movie Festival">Movie Festival</option>
            <option value="Music Festival">Music Festival</option>
          </select>
        </div>
      </div>
    </section>

    <section id="events-grid" class="events-grid">
      <!-- Events rendered here by JS -->
    </section>

    <p id="no-events" class="no-events" hidden>No events to show. Add one to get started!</p>
  </main>

  <!-- Add / Edit Event Modal -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal">
      <h2 id="modal-title">Add Event</h2>
      <form id="event-form">
        <input type="hidden" id="event-id">

        <div class="form-group">
          <label for="event-name">Name</label>
          <input type="text" id="event-name" required placeholder="e.g. Jazz Festival">
        </div>

        <div class="form-group">
          <label for="event-location">Location</label>
          <input type="text" id="event-location" required placeholder="e.g. Central Park, NYC">
        </div>

        <div class="form-group">
          <label for="event-category">Category</label>
          <select id="event-category" required>
            <option value="">Select a category</option>
            <option value="Exhibition">Exhibition</option>
            <option value="Concert">Concert</option>
            <option value="Theatre">Theatre</option>
            <option value="Contemporary Dance">Contemporary Dance</option>
            <option value="Movie Festival">Movie Festival</option>
            <option value="Music Festival">Music Festival</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="event-start">Starts</label>
            <input type="date" id="event-start" required>
          </div>
          <div class="form-group">
            <label for="event-end">Ends</label>
            <input type="date" id="event-end" required>
          </div>
        </div>

        <div class="form-group">
          <label for="event-link">Link</label>
          <input type="url" id="event-link" placeholder="https://...">
        </div>

        <div class="form-group">
          <label for="event-image">Image</label>
          <div class="image-upload" id="image-upload-area">
            <input type="file" id="event-image" accept="image/*" hidden>
            <div id="image-preview" class="image-preview"></div>
            <button type="button" id="image-upload-btn" class="btn btn-secondary">Choose Image</button>
            <button type="button" id="image-remove-btn" class="btn btn-danger image-remove-btn" hidden>Remove</button>
          </div>
        </div>

        <div class="form-group">
          <label for="event-details">Details</label>
          <textarea id="event-details" rows="3" placeholder="What's this event about?"></textarea>
        </div>

        <div class="form-actions">
          <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Event Detail Overlay -->
  <div id="detail-overlay" class="modal-overlay" hidden>
    <div class="detail-modal">
      <button id="detail-close" class="detail-close">&times;</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
