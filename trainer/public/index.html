<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Trainer AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Personal Trainer AI</h1>
    <p class="subtitle">Your AI-powered workout coach</p>
    <nav>
      <button class="nav-btn active" data-view="profile">Profile</button>
      <button class="nav-btn" data-view="generate">Generate Plan</button>
      <button class="nav-btn" data-view="plans">My Plans</button>
      <button class="nav-btn" data-view="log">Log Workout</button>
      <button class="nav-btn" data-view="exercises">Exercise Library</button>
    </nav>
  </header>

  <main>
    <!-- PROFILE VIEW -->
    <section id="view-profile" class="view active">
      <h2>Your Profile</h2>
      <form id="profile-form">
        <input type="hidden" id="profile-id">
        <div class="form-row">
          <div class="form-group">
            <label for="profile-name">Name</label>
            <input type="text" id="profile-name" required placeholder="Your name">
          </div>
          <div class="form-group">
            <label for="profile-age">Age</label>
            <input type="number" id="profile-age" min="10" max="100" placeholder="30">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="profile-weight">Weight (kg)</label>
            <input type="number" id="profile-weight" step="0.1" placeholder="75">
          </div>
          <div class="form-group">
            <label for="profile-height">Height (cm)</label>
            <input type="number" id="profile-height" step="0.1" placeholder="178">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="profile-goal">Fitness Goal</label>
            <select id="profile-goal">
              <option value="build muscle">Build Muscle</option>
              <option value="lose fat">Lose Fat</option>
              <option value="general fitness">General Fitness</option>
              <option value="strength">Build Strength</option>
              <option value="endurance">Improve Endurance</option>
              <option value="athletic performance">Athletic Performance</option>
            </select>
          </div>
          <div class="form-group">
            <label for="profile-experience">Experience Level</label>
            <select id="profile-experience">
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="profile-equipment">Available Equipment</label>
            <select id="profile-equipment">
              <option value="full gym">Full Gym</option>
              <option value="dumbbells only">Dumbbells Only</option>
              <option value="barbell and dumbbells">Barbell + Dumbbells</option>
              <option value="bodyweight">Bodyweight Only</option>
              <option value="home gym">Home Gym (basic)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="profile-days">Days Per Week</label>
            <select id="profile-days">
              <option value="2">2 days</option>
              <option value="3" selected>3 days</option>
              <option value="4">4 days</option>
              <option value="5">5 days</option>
              <option value="6">6 days</option>
            </select>
          </div>
        </div>
        <div class="form-group full-width">
          <label for="profile-injuries">Injuries / Limitations</label>
          <textarea id="profile-injuries" rows="2" placeholder="e.g., Bad left knee, shoulder impingement..."></textarea>
        </div>
        <div class="form-group full-width">
          <label for="profile-notes">Additional Notes</label>
          <textarea id="profile-notes" rows="4" placeholder="Past training experience, exercises you like/dislike, notes from your previous trainer..."></textarea>
        </div>
        <button type="submit" class="btn-primary">Save Profile</button>
        <span id="profile-status" class="status-msg"></span>
      </form>
    </section>

    <!-- GENERATE VIEW -->
    <section id="view-generate" class="view">
      <h2>Generate Workout Plan</h2>
      <p>Click the button to generate a new weekly workout plan based on your profile, exercise library, and workout history.</p>
      <div id="generate-profile-summary" class="profile-summary"></div>
      <button id="btn-generate" class="btn-primary btn-large">Generate This Week's Plan</button>
      <div id="generate-status" class="status-msg"></div>
      <div id="generated-plan" class="plan-display"></div>
    </section>

    <!-- PLANS VIEW -->
    <section id="view-plans" class="view">
      <h2>My Workout Plans</h2>
      <div id="plans-list" class="plans-list"></div>
    </section>

    <!-- LOG VIEW -->
    <section id="view-log" class="view">
      <h2>Log a Workout</h2>
      <form id="log-form">
        <div class="form-group">
          <label for="log-plan">Linked Plan (optional)</label>
          <select id="log-plan">
            <option value="">— No linked plan —</option>
          </select>
        </div>
        <div class="form-group full-width">
          <label for="log-exercises">What did you do? (exercises, sets, reps, weight)</label>
          <textarea id="log-exercises" rows="6" placeholder="e.g.&#10;Bench Press: 4x10 @ 60kg&#10;Incline DB Press: 3x12 @ 22kg&#10;Cable Flyes: 3x15 @ 15kg"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="log-feeling">How did it feel?</label>
            <select id="log-feeling">
              <option value="easy">Easy</option>
              <option value="moderate" selected>Moderate</option>
              <option value="hard">Hard</option>
              <option value="exhausted">Exhausted</option>
            </select>
          </div>
        </div>
        <div class="form-group full-width">
          <label for="log-notes">Notes</label>
          <textarea id="log-notes" rows="2" placeholder="Anything else to note..."></textarea>
        </div>
        <button type="submit" class="btn-primary">Save Log</button>
        <span id="log-status" class="status-msg"></span>
      </form>
      <h3>Recent Logs</h3>
      <div id="logs-list" class="logs-list"></div>
    </section>

    <!-- EXERCISES VIEW -->
    <section id="view-exercises" class="view">
      <h2>Exercise Library</h2>
      <div id="exercise-filters">
        <select id="filter-muscle">
          <option value="">All Muscle Groups</option>
        </select>
        <select id="filter-equipment">
          <option value="">All Equipment</option>
        </select>
      </div>
      <div id="exercises-list" class="exercises-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
